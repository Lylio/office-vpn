spring.application.name=vpn-app

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vpn_app}
spring.datasource.username=${DB_USER:vpn_user}
spring.datasource.password=${DB_PASSWORD:vpn_password}

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080